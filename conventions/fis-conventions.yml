reversibility:
  grade: documented
  detail: >-
    Reversal paths exist for the main write surface and are named in the contract, but the
    provider states no window for any of them, so this grades `documented` rather than
    `verified`. No retention, undo, or restore period is published anywhere in the docs, and
    none is invented here.
  surfaces:
  - write: push-invoices / push-bills / push-accounts (POST /v2/accounting/...)
    reversal: DELETE /v2/accounting/invoices/{id}, DELETE /v2/accounting/bills/{id}
    operations:
    - delete-invoices
    - delete-bills
    window: null
    window_source: null
    note: >-
      Deletion is proxied through to the customer's own accounting system, so whether it is
      reversible at all depends on that system's rules — which the contract does not surface.
  - write: push-bill-payments / push-invoice-payments
    reversal: DELETE /v2/accounting/bills/payments/{id}, DELETE /v2/accounting/invoices/payments/{id}
    operations:
    - delete-bill-payments
    - delete-invoices-payments
    window: null
    window_source: null
  - write: push-refund (POST /v2/accounting/refunds)
    reversal: null
    operations: []
    window: null
    note: A refund is itself a reversal of a payment; there is no operation to reverse the refund.
  - write: business creation
    reversal: DELETE /v2/businesses/{uuid}
    operations:
    - delete business by name
    window: null
    note: Deleting a business tears down its connections and synced data. No restore operation exists and no retention period is stated.
  - write: connection (created via the Connect widget, not the REST API)
    reversal: PUT /v2/connections/disconnect
    operations:
    - disable connection
    window: null
    note: Disconnect stops the sync; the docs do not say whether previously synced data survives or for how long.
  no_reversal:
  - operation: dataSync (POST /v2/data/sync)
    note: >-
      Queues a sync. There is a deleteStatus endpoint to watch a delete complete, but no
      operation to cancel a queued or in-flight sync.
