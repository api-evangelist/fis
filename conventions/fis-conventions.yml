api: FIS Accounting Data as a Service
base_url: https://api.railz.ai
scope_note: >-
  These conventions describe the one FIS API with a publicly readable contract. Code Connect
  core banking, payments and wealth are behind a reviewed registration and their conventions are
  not readable without an account; nothing here is asserted about them.
authentication:
  style: bearer
  mint: HTTP Basic (client_id / secret_key) against the access-token endpoint
  header: Authorization
  token_lifetime_minutes: 60
  see: authentication/fis-authentication.yml
idempotency:
  supported: false
  coverage: none
  mechanism: null
  header: null
  scope: []
  detail: >-
    No replay protection of any kind. Not one of the 86 mutating operations (59 POST, 26 PUT,
    6 DELETE, 1 PATCH) accepts an Idempotency-Key or any equivalent client-supplied token, and
    the docs describe none. Combined with the absence of Retry-After on 429 and the presence of
    502/503/504 in the documented status set, a client that retries a timed-out push has no way
    to avoid writing the record twice into the customer's books. For a write path that lands in
    an accounting ledger this is the sharpest gap in the contract.
pagination:
  style: offset-limit
  params:
    offset: offset
    limit: limit
  applies_to: 103 operations
  response_fields:
    container: meta
    schema: PaginationMetaData
    fields:
    - offset
    - limit
    - count
  cursor: false
  detail: Classic offset/limit with a total count returned in meta. No cursor or keyset option, so deep pages over a large ledger get progressively more expensive.
filtering:
  common_params:
  - name: connectionUuid
    operations: 84
    note: The primary scoping key — which authorised upstream connection to read from.
  - name: businessName
