excluded:
- name: '@worldpay/*'
  reason: >-
    Worldpay is no longer FIS. FIS sold its majority stake in 2024 and Worldpay was subsequently
    acquired by Global Payments; the @worldpay npm scope is not an FIS surface and is not counted here.
- name: railz-client
  reason: npm description says "Unofficial Railz API client" — third party, official:false, not counted.
coverage:
  official_count: 9
  languages:
  - javascript
  note: >-
    Every first-party package is a browser/JS surface — an embeddable Connect widget, a UI kit
    and a charting library. There is no server-side API client in any language for the 233
    operations the REST contract exposes; integrators call it over plain HTTP.
