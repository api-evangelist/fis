ownership_note: >-
  The @railzai npm scope and the github.com/railz-ai organisation are the publishing surface of
  Railz, acquired by FIS and now shipped as FIS Accounting Data as a Service — FIS's own
  developer page (https://www.fisglobal.com/developer) lists dashboard.railz.ai as one of its
  four product developer portals, the OpenAPI at api.railz.ai declares info.title
  "FIS Accounting Data as a Service™ API", and docs.railz.ai resolves through a ReadMe tenant
  named fis-accounting-group. The packages carry the pre-acquisition Railz name; the product is FIS.
