naftiko: 1.0.0-alpha2
info:
  label: FIS Payments API — Wire Transfers
  description: 'FIS Payments API — Wire Transfers. 1 operations. Lead operation: Initiate wire transfer. Self-contained Naftiko
    capability covering one Fis business surface.'
  tags:
  - Fis
  - Wire Transfers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    FIS_API_KEY: FIS_API_KEY
capability:
  consumes:
  - type: http
    namespace: payments-wire-transfers
    baseUri: https://api.fisglobal.com/v1
    description: FIS Payments API — Wire Transfers business capability. Self-contained, no shared references.
    resources:
    - name: wire-transfers
      path: /wire-transfers
      operations:
      - name: initiatewiretransfer
        method: POST
        description: Initiate wire transfer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.FIS_API_KEY}}'
  exposes:
  - type: rest
    namespace: payments-wire-transfers-rest
    port: 8080
    description: REST adapter for FIS Payments API — Wire Transfers. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/wire-transfers
      name: wire-transfers
      description: REST surface for wire-transfers.
      operations:
      - method: POST
        name: initiatewiretransfer
        description: Initiate wire transfer
        call: payments-wire-transfers.initiatewiretransfer
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: payments-wire-transfers-mcp
    port: 9090
    transport: http
    description: MCP adapter for FIS Payments API — Wire Transfers. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: initiate-wire-transfer
      description: Initiate wire transfer
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: payments-wire-transfers.initiatewiretransfer
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
