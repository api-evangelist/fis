domain_standard_note: >-
  REWARD-ONLY check, and FIS earns nothing on it from its public surface. The three standards
  its market actually speaks — OFX for accounting exchange, ISO 20022 for payment messaging,
  FDX for consented financial-data sharing — are each absent from the one contract that can be
  read. That is a finding about the readable surface, not a claim that FIS does not implement
  them elsewhere: its ISO 20022 work is real and sits inside licensed core-banking products
  that publish nothing publicly.
