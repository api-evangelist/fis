description: >-
  FIS publishes named plans for exactly one of its API products. FIS Accounting Data as a
  Service (formerly Railz) has a two-tier public page with a free entry tier and an enterprise
  tier; no dollar figure is printed for either. Every other FIS API surface — Code Connect core
  banking, payments and wealth, Total Issuing, Everlink — is licensed under a negotiated
  customer agreement with no public price, plan, or quota, and is recorded here as such rather
  than being given invented tiers.
supersedes:
  note: >-
    Replaces the 2026-05-04 bulk-sweep file, which was marked method:generated and carried three
    scaffold tiers (fis-sandbox, and siblings) priced at 0.00 against domains on
    api.fisglobal.com — a host that returns NXDOMAIN. Those tiers were not published by FIS and
    are withdrawn.
