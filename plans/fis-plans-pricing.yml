specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: FIS
providerId: fis
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Banking
  - Core Banking
  - Financial Services
  - Payments
  - Wealth Management
description: FIS (Fidelity National Information Services) is a B2B fintech provider whose APIs (Code Connect, IFX, Modern Banking Platform, FIS Payments, Wealth) are licensed to financial institutions under negotiated master service agreements. There is no public developer pricing — access requires a customer contract, and limits/fees are set per institution.
notes: No public pricing page on fisglobal.com; developer.fis.com is not publicly indexed. Scaffold tiers replaced with a Sandbox / Customer-licensed / Enterprise model. All commercial pricing remains contact-sales.
sources:
  - https://www.fisglobal.com/
  - https://developer.fis.com/
plans:
  - id: fis-sandbox
    name: Sandbox / Code Connect
    type: freemium
    description: Sandbox environment via FIS Code Connect for evaluation by partners and prospective customers. No production transaction processing; access subject to FIS partner-program approval.
    entries:
      - label: Sandbox Access
        description: Non-production sandbox testing for FIS APIs
        name: sandbox_access
        type: flat
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        domains:
          - https://api.fisglobal.com
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Code Connect Documentation
      - name: Sandbox Credentials
      - name: Partner Program (Application Required)
      - name: FIS Core Banking API
      - name: FIS Payments API
      - name: FIS Wealth Management API
  - id: fis-customer-licensed
    name: Customer-Licensed
    type: enterprise
    description: Production access for FIS customer financial institutions under master service agreement. Pricing is per-product (Modern Banking Platform, IBS, HORIZON, etc.), typically structured as implementation/licensing plus per-account, per-transaction, or per-asset fees depending on the product line.
    entries:
      - label: Per-Product Licensing
        description: Per-product licensing and implementation fees
        name: licensing
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        domains:
          - https://api.fisglobal.com
        unit: 1
        price: contact sales
        userMultiplied: false
      - label: Transaction / Account Fees
        description: Per-transaction or per-account/asset fees per the product agreement
        name: usage_fees
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: global
        domains:
          - https://api.fisglobal.com
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Production API Access
      - name: Named Account Management
      - name: Implementation Services
      - name: SOC 2 / Bank-Grade Compliance
      - name: FIS Core Banking API
      - name: FIS Payments API
      - name: FIS Wealth Management API
  - id: fis-enterprise
    name: Enterprise / Strategic
    type: enterprise
    description: Tier-1 bank or strategic-customer arrangement with negotiated SLAs, dedicated capacity, multi-region deployment, and bespoke integration. Pricing fully custom.
    entries:
      - label: Negotiated Volume
        description: Custom volume and SLA terms
        name: enterprise
        type: flat
        metric: varies
        limit: -1
        timeFrame: usage
        geo: configurable
        domains:
          - https://api.fisglobal.com
        unit: 1
        price: custom
        userMultiplied: false
    elements:
      - name: Dedicated Tenancy / Private Cloud Deployment
      - name: Contractual SLA
      - name: 24/7 Dedicated Support
      - name: Custom Data Residency
      - name: FIS Core Banking API
      - name: FIS Payments API
      - name: FIS Wealth Management API
maintainers: []
