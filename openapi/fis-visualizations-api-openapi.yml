  /v2/visualizations/revenue:
    get:
      description: '**Supported for:**


        `freshbooks` `quickbooks` `quickbooksDesktop` `xero` `dynamicsBusinessCentral` `zohoBooks` `byod`'
      operationId: reportRevenue
      parameters:
      - name: connectionUuid
        required: true
        in: query
        description: Unique connection identifier.
        schema:
          type: string
      - name: startDate
        required: true
        in: query
        description: 'The start date of the report frequency in the format: yyyy-MM-dd.'
        schema:
          type: string
      - name: endDate
        required: true
        in: query
        description: 'The end date of the report frequency in the format: yyyy-MM-dd.'
        schema:
          type: string
      - name: reportFrequency
        required: true
        in: query
        description: The report snapshot frequency.
        schema:
          enum:
          - month
          - quarter
          - year
          type: string
      - name: accountingMethod
        required: false
        in: query
        schema:
          default: accrual
          type: string
          enum:
          - cash
          - accrual
      responses:
        '200':
          description: Successfully returned revenue report
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    readOnly: true
                    properties:
                      reportId:
                        type: array
                        readOnly: true
                        example:
                        - 5fad8a342a88364234392fb5
                        items:
                          type: string
                      serviceName:
                        type: string
                        enum:
                        - freshbooks
                        - quickbooks
                        - quickbooksDesktop
                        - xero
                        - oracleNetsuite
                        - sageBusinessCloud
                        - sageIntacct
                        - dynamicsBusinessCentral
                        - dynamics365Finance
                        - wave
                        - myob
                        - zohoBooks
                        - byod
                        readOnly: true
                        example: xero
                      businessName:
                        type: string
                        readOnly: true
                        example: Railz
                      endDate:
                        type: string
                        readOnly: true
                        example: '2020-12-25T01:02:03Z'
                        description: if report frequency is monthly, end date is maximum of 12 months from start date, if quaterly, its a maximum of 3 years from start date, if yearly, its maximum of 12 years from start date
                      startDate:
                        type: string
                        readOnly: true
                        example: '2020-11-25T01:02:03Z'
                      reportFrequency:
                        type: string
                        readOnly: true
                        example: month
                        enum:
                        - month
                        - quarter
                        - year
                      currency:
                        type: string
                        readOnly: true
                        example: USD
                    required:
                    - reportId
                    - serviceName
                    - businessName
                    - startDate
                    - endDate
                    - reportFrequency
                    - currency
                  data:
                    type: object
                    readOnly: true
                    properties:
                      subSections:
                        type: array
                        description: 'For each subsection, get its end date values and return the top 3 and the remaining sub section values should be summed up and indicated in the last object where name = ''Other'' '
                        items:
                          type: object
                          readOnly: true
                          properties:
                            name:
                              type: string
                              example: Operating Expenses
                              description: Sub section with the largest amount
                            amount:
                              type: number
                              example: 1200
                              minimum: 0
                              description: Total of all values in the expenses section in incomeStatement results
                          example:
                          - name: Utilities
                            amount: 2300
                          - name: Service Fee Income
                            amount: 1000
                          - name: Other
                            amount: 200
                          required:
                          - name
                          - amount
                      totalAmount:
                        type: number
                        example: 3500
                        description: Total of all values in the expenses section in incomeStatement results as at end date
                      percentageChange:
                        type: number
                        example: 15
                        description: Percentage change between previous period and current end date period
                    required:
                    - totalAmount
                    - percentChange
                    - subSections
                readOnly: true
                required:
                - meta
                - data
        '202':
          description: Data in pending state
        '204':
          description: No data available
        '400':
          description: Bad Request Error - Thrown if fields sent via query does not follow specifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400ResponseDto'
        '401':
          description: Unauthorized - Not logged in or log in expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401ResponseDto'
        '403':
          description: Forbidden - Not enough permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403ResponseDto'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500ResponseDto'
      security:
      - bearer: []
      summary: List Revenue report
      tags:
      - Visualizations
