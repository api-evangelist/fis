components:
  schemas:
    PushInvoiceCreditNoteV2:
      type: object
      properties:
        passThrough:
          type: object
          example:
            CustomField:
            - DefinitionId: '1'
              StringValue: my custom value
              Name: Field One
          additionalProperties: true
        currencyRate:
          type: number
          example: '1.13'
        postedDate:
          type: string
          format: date
          example: '2021-03-29'
        allocatedOnDate:
          type: string
          format: date
          example: '2021-03-29'
        memo:
          type: string
          maxLength: 4000
          example: Example memo.
        customerRef:
          $ref: '#/components/schemas/CustomerRefDto'
        currency:
          type: string
          example: CAD
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceCreditNoteLineV2'
        subsidiaryRefs:
          type: array
          items:
            $ref: '#/components/schemas/SubsidiaryRefDto'
        invoiceCreditNoteNumber:
          type: string
          description: The buyer facing document number of the invoice credit note.
      required:
      - customerRef
      - lines
    Error401Dto:
      type: object
      properties:
        statusCode:
          type: number
          readOnly: true
          example: 401
        message:
          readOnly: true
          example:
          - Unauthorized
          type: array
          items:
            type: string
        error:
          type: string
          readOnly: true
          example: Unauthorized
      required:
      - statusCode
      - message
      - error
    CustomerRef:
      type: object
      properties:
        id:
          type: string
          example: '1'
        name:
          type: string
          example: Railz Financial
      required:
      - id
    GetInvoiceV2Data:
      type: object
      properties:
        id:
          type: string
          example: '1'
        invoiceNumber:
          type: string
          example: string
        customerRef:
          $ref: '#/components/schemas/CustomerRef'
        dueDate:
          format: date-time
          type: string
          example: '2021-03-09T15:59:47.118Z'
        currencyRate:
          type: number
          example: 1.13
          format: float
        totalAmount:
          type: number
          example: 283
          format: float
        status:
          type: string
          enum:
          - open
          - draft
          - partiallyPaid
          - paid
          - unknown
          - void
          - reversed
          - reversal
        totalDiscount:
          type: number
          example: 0
          format: float
        subTotal:
          type: number
          example: 250.5
          format: float
        taxAmount:
          type: number
          example: 32.5
          format: float
        amountDue:
          type: number
          example: 283
          format: float
        discountPercentage:
          type: number
          example: 0
          format: float
        sourceModifiedDate:
          format: date-time
          type: string
          example: '2021-03-09T15:59:47.118Z'
        memo:
          type: string
          example: Example invoice memo.
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payments'
        subsidiaryRefs:
          type: array
          items:
            $ref: '#/components/schemas/SubsidiaryRef'
        postedDate:
          format: date-time
          type: string
          example: '2021-03-09T15:59:47.118Z'
        currency:
          type: string
          example: USD
        invoiceType:
          type: string
          enum:
          - item
          - service
          - professional
          - miscellaneous
          example: item
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineItemsV2'
        passThrough:
          type: object
          additionalProperties: true
          example:
            CustomField:
            - DefinitionId: '1'
              StringValue: my custom value
              Name: Field One
      required:
      - id
      - status
    InventoryRef:
      type: object
      properties:
        id:
          type: string
          example: '1'
        name:
          type: string
          example: Digital Services
      required:
      - id
    UpdateInvoicePayment:
      type: object
      properties:
        passThrough:
          type: object
          example:
            CustomField:
            - DefinitionId: '1'
              StringValue: my custom value
              Name: Field One
          additionalProperties: true
        accountRef:
          $ref: '#/components/schemas/AccountRefDto'
        customerRef:
          $ref: '#/components/schemas/CustomerRefDto'
        totalAmount:
          type: number
          format: float
          example: 200.5
        currency:
          type: string
          example: CAD
        currencyRate:
          type: number
          format: float
          example: 1.13
        date:
          type: string
          format: date
          example: '2021-03-29'
        paymentMethod:
          type: string
          deprecated: true
          enum:
          - check
          - creditCard
          - cash
          - other
        memo:
          type: string
          maxLength: 4000
          example: Invoice payment memo.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/UpdateInvoicePaymentLineV2'
        subsidiaryRefs:
          type: array
          items:
            $ref: '#/components/schemas/SubsidiaryRefDto'
    Error401ResponseDto:
      type: object
      properties:
        error:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/Error401Dto'
        payload:
          type: object
          readOnly: true
          example: {}
      required:
      - error
      - payload
    PushInvoicePaymentV2Dto:
      type: object
      properties:
        connectionUuid:
          type: string
          description: Unique connection identifier.
          example: CON-396d5daa-26b2-4979-89b6-cafb2c298155
        data:
          $ref: '#/components/schemas/PushInvoicePaymentV2'
      required:
      - connectionUuid
      - data
    Error403ResponseDto:
      type: object
      properties:
        error:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/Error403Dto'
        payload:
          type: object
          readOnly: true
          example: {}
      required:
      - error
      - payload
    PushInvoiceCreditNoteV2ResponseDto:
      type: object
      properties:
        connectionUuid:
          type: string
          readOnly: true
          example: CON-396d5daa-26b2-4979-89b6-cafb2c298155
        businessName:
          type: string
          readOnly: true
          example: Railz
        serviceName:
          type: string
          readOnly: true
          example: xero
          enum:
          - freshbooks
          - quickbooks
          - quickbooksDesktop
          - xero
          - oracleNetsuite
          - sageBusinessCloud
