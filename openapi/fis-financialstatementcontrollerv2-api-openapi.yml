components:
  schemas:
    IncomeStatementsReportView:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/FinancialStatementReportMetaDataV2'
        data:
          $ref: '#/components/schemas/IncomeStatementReportData'
      required:
      - meta
      - data
    BalanceSheetsReportView:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/FinancialStatementReportMetaDataV2'
        data:
          $ref: '#/components/schemas/BalanceSheetReportData'
      required:
      - meta
      - data
    Error401Dto:
      type: object
      properties:
        statusCode:
          type: number
          readOnly: true
          example: 401
        message:
          readOnly: true
          example:
          - Unauthorized
          type: array
          items:
            type: string
        error:
          type: string
          readOnly: true
          example: Unauthorized
      required:
      - statusCode
      - message
      - error
    Error403ResponseDto:
      type: object
      properties:
        error:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/Error403Dto'
        payload:
          type: object
          readOnly: true
          example: {}
      required:
      - error
      - payload
    IncomeStatementsReportResponseDto:
      type: object
      properties:
        reports:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/IncomeStatementsReportView'
      required:
      - reports
    Error401ResponseDto:
      type: object
      properties:
        error:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/Error401Dto'
        payload:
          type: object
          readOnly: true
          example: {}
      required:
      - error
      - payload
    FinancingActivities:
      type: object
      properties:
        stock:
          type: object
          additionalProperties: true
          example:
            Stocks: 2500
        totalStock:
          type: object
        proceedsFinancing:
          type: object
          additionalProperties: true
          example:
            Proceeds: 5400
        totalProceedsFinancing:
          type: number
        adjustmentsFinancing:
          type: object
          additionalProperties: true
          example:
            Adjustments: 1300
        totalAdjustmentsFinancing:
          type: number
        payments:
          type: object
          additionalProperties: true
          example:
            Payables: 5400
        totalPayments:
          type: number
        netCashByFinancingActivities:
          type: number
      required:
      - stock
      - totalStock
      - proceedsFinancing
      - totalProceedsFinancing
      - adjustmentsFinancing
      - totalAdjustmentsFinancing
      - payments
      - totalPayments
      - netCashByFinancingActivities
    PaginationMetaData:
      type: object
      properties:
        offset:
          type: number
          readOnly: true
        limit:
          type: number
          readOnly: true
        count:
          type: number
          readOnly: true
      required:
      - offset
      - limit
      - count
    InvestingActivities:
      type: object
      properties:
        propertyPlantAndEquipment:
          type: object
          additionalProperties: true
          example:
            Equipment: 8000
        totalPropertyPlantAndEquipment:
          type: number
        proceedsInvesting:
          type: object
          additionalProperties: true
          example:
            Proceeds: 5400
        totalProceedsInvesting:
          type: number
        intangibles:
          type: object
          additionalProperties: true
          example:
            Intangibles: 5400
        totalIntangibles:
          type: number
        payments:
          type: object
          additionalProperties: true
          example:
            Payables: 5400
        totalPayments:
          type: number
        netCashByInvestingActivities:
          type: number
      required:
      - propertyPlantAndEquipment
      - totalPropertyPlantAndEquipment
      - proceedsInvesting
      - totalProceedsInvesting
      - intangibles
      - totalIntangibles
      - payments
      - totalPayments
      - netCashByInvestingActivities
    Error500Dto:
      type: object
      properties:
        error:
          type: string
          readOnly: true
          example: Internal Server Error
        message:
          readOnly: true
          example:
          - INTERNAL_ERROR
          type: array
          items:
            type: string
        statusCode:
          type: number
          readOnly: true
          example: 500
      required:
      - error
      - message
      - statusCode
    CashflowStatementsV2Data:
      type: object
      properties:
        section:
          type: string
          example: Operating Activities
          enum:
          - Operating Activities
          - Financing Activities
          - Investing Activities
          - Cash
        subSection:
          type: string
          example: Payments
          enum:
          - Payments
          - Adjustments
          - Changes
          - Proceeds
          - Stock
          - Intangibles
          - Property Plant And Equipment
          - Cash
        group:
          type: string
          example: Financing Activities
        subGroup:
          type: string
          example: Retained Earnings
        accountId:
          type: string
          example: '3928'
        subAccountId:
          type: string
          example: '231'
        account:
          type: string
          readOnly: true
          example: Financing Activities
        subAccount:
          type: string
          example: Retained Earnings
        value:
          type: number
          readOnly: true
          example: 13000
          format: float
        fullyQualifiedName:
          type: string
          example: 'Expenses : Transportation : Car Mileage'
          description: Full name of the account and parent account(s), colon separated.
        depth:
          type: number
          example: 3
          description: The sub account depth, based on it's account hierarchy level. E.g. top parent account would have a depth of 1.
        classification:
          type: string
          example: Assets
        type:
          type: string
          example: Fixed Assets
        subType:
          type: string
          example: Fixed Assets
      required:
      - section
      - subSection
      - account
      - value
      - depth
    Liabilities:
      type: object
      properties:
        currentLiabilities:
          type: object
          additionalProperties: true
          example:
            Accounts Payable: 5400
        totalCurrentLiabilities:
          type: number
        nonCurrentLiabilities:
          type: object
          additionalProperties: true
          example:
            Services: 1200
        totalNonCurrentLiabilities:
          type: number
        totalLiabilities:
          type: number
      required:
      - currentLiabilities
      - totalCurrentLiabilities
      - nonCurrentLiabilities
      - totalNonCurrentLiabilities
      - totalLiabilities
    CashflowStatementsReportResponseDto:
      type: object
      properties:
        reports:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/CashflowReportView'
      required:
      - reports
    IncomeStatementsResponseV2Dto:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationMetaData'
        reports:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/IncomeStatementsReportV2'
      required:
      - pagination
      - reports
    CashflowReportView:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/FinancialStatementReportMetaDataV2'
        data:
          $ref: '#/components/schemas/CashflowReportStatementData'
      required:
      - meta
      - data
    CashflowReportStatementData:
      type: object
      properties:
        operatingActivities:
          $ref: '#/components/schemas/OperatingActivities'
        investingActivities:
          $ref: '#/components/schemas/InvestingActivities'
        financialActivities:
          $ref: '#/components/schemas/FinancingActivities'
        netCashIncreaseForPeriod:
