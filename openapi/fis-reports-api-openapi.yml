  /reports/railzScore:
    get:
      description: API to retrieve formatted credit score report
      operationId: reportRailzScore
      parameters:
      - name: businessName
        required: true
        in: query
        description: Unique business name identifier.
        schema:
          type: string
      - name: serviceName
        required: true
        in: query
        description: Name of accounting service provider, reuse currently available enum used in the feeder
        schema:
          type: string
          enum:
          - freshbooks
          - quickbooks
          - quickbooksDesktop
          - xero
          - oracleNetsuite
          - sageBusinessCloud
          - sageIntacct
          - dynamicsBusinessCentral
          - zohoBooks
          - byod
      - name: startDate
        required: false
        in: query
        description: 'The start date of the report frequency in the format: yyyy-MM-dd.'
        schema:
          type: string
        deprecated: true
      - name: endDate
        required: false
        in: query
        description: 'The end date of the report frequency in the format: yyyy-MM-dd.'
        schema:
          type: string
      responses:
        '200':
          description: Successfully returned credit score
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    readOnly: true
                    properties:
                      reportId:
                        type: array
                        readOnly: true
                        example:
                        - 5fad8a342a88364234392fb5
                        items:
                          type: string
                      serviceName:
                        type: string
                        enum:
                        - freshbooks
                        - quickbooks
                        - quickbooksDesktop
                        - xero
                        - oracleNetsuite
                        - sageBusinessCloud
                        - sageIntacct
                        - dynamicsBusinessCentral
                        - dynamics365Finance
                        - wave
                        - myob
                        - zohoBooks
                        - byod
                        readOnly: true
                        example: xero
                      businessName:
                        type: string
                        readOnly: true
                        example: Railz
                      endDate:
                        type: string
                        readOnly: true
                        example: '2020-12-25T01:02:03Z'
                        description: if report frequency is monthly, end date is maximum of 12 months from start date, if quaterly, its a maximum of 3 years from start date, if yearly, its maximum of 12 years from start date
                      startDate:
                        type: string
                        readOnly: true
                        example: '2020-11-25T01:02:03Z'
                    required:
                    - reportId
                    - serviceName
                    - businessName
                    - startDate
                    - endDate
                    - reportFrequency
                    - currency
                  data:
                    type: object
                    readOnly: true
                    properties:
                      score:
                        type: integer
                        description: A standard point in time credit score based on a 1-year probability of default in the range of 300-850.
                        example: 800
                        minimum: 300
                        maximum: 850
                      rating:
                        type: string
                        description: Railz credit rating
                        example: Excellent
                      lastUpdated:
                        type: string
                        description: Last synchronization date
                        example: '2020-12-31'
                required:
                - meta
                - data
