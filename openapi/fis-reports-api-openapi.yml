openapi: 3.2.0
info:
  title: FIS® Accounting Data as a Service™ Reports API
  description: What's changed in our API
  version: v2
  contact: {}
servers:
- url: https://api.railz.ai
  description: Main (production) API server
tags:
- name: Reports
paths:
  /reports/invoices:
    get:
      description: API to retrieve formatted invoices report
      operationId: reportInvoices
      parameters:
      - name: businessName
        required: true
        in: query
        description: Unique business name identifier.
        schema:
          type: string
      - name: serviceName
        required: true
        in: query
        description: Name of accounting service provider, reuse currently available enum used in the feeder
        schema:
          type: string
          enum:
          - freshbooks
          - quickbooks
          - quickbooksDesktop
          - xero
          - oracleNetsuite
          - sageBusinessCloud
          - sageIntacct
          - dynamicsBusinessCentral
          - dynamics365Finance
          - wave
          - myob
          - zohoBooks
      - name: startDate
        required: true
        in: query
        description: 'The start date of the report frequency in the format: yyyy-MM-dd.'
        schema:
          type: string
      - name: endDate
        required: true
        in: query
        description: 'The end date of the report frequency in the format: yyyy-MM-dd.'
        schema:
          type: string
      responses:
        '200':
          description: Successfully returned invoices report
          content:
            application/json:
              schema:
                type: object
                readOnly: true
                properties:
                  meta:
                    type: object
                    readOnly: true
                    properties:
                      reportId:
                        type: array
                        items:
                          type: string
                        readOnly: true
                        example:
                        - 5fad8a342a88364234392fb5
                      serviceName:
                        type: string
                        readOnly: true
                        enum:
                        - freshbooks
                        - quickbooks
                        - quickbooksDesktop
                        - xero
                        - oracleNetsuite
                        - sageBusinessCloud
                        - sageIntacct
                        - dynamicsBusinessCentral
                        - dynamics365Finance
                        - wave
                        - myob
                        - zohoBooks
                        - byod
                        example: xero
                      businessName:
                        type: string
                        readOnly: true
                        example: Railz
                      createdAt:
                        type: string
                        readOnly: true
                        example: '2020-12-25T01:02:03Z'
                      updatedAt:
                        type: string
                        readOnly: true
                        example: '2020-12-25T01:02:03Z'
                      endDate:
                        type: string
                        readOnly: true
                        example: '2020-12-25T01:02:03Z'
                        description: if report frequency is monthly, end date is maximum of 12 months from start date, if quaterly, its a maximum of 3 years from start date, if yearly, its maximum of 12 years from start date
                      startDate:
                        type: string
                        readOnly: true
                        example: '2020-11-25T01:02:03Z'
                    required:
                    - reportId
                    - serviceName
                    - businessName
                    - endDate
                    - startDate
                  data:
                    type: object
                    readOnly: true
                    properties:
                      unpaidAmount:
                        type: number
                        description: sum of amount due
                        minimum: 0
                        example: 0
                      paidAmount:
                        type: number
                        description: sum (latestAmount - amountDue)
                        minimum: 0
                        example: 1000
                      overdueAmount:
                        type: number
                        description: where current Date > dueDate, sum amountDue
                        minimum: 0
                    required:
                    - unpaidAmount
                    - paidAmount
                    - overdueAmount
                required:
                - meta
                - data
        '202':
          description: Data in pending state
        '204':
          description: No data available
        '400':
          description: Bad Request Error - Thrown if fields sent via query does not follow specifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400ResponseDto'
        '401':
          description: Unauthorized - Not logged in or log in expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401ResponseDto'
        '403':
          description: Forbidden - Not enough permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403ResponseDto'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500ResponseDto'
      security:
      - bearer: []
      summary: Report invoices
      tags:
      - Reports
      x-summary-source: derived
