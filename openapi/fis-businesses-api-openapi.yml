  /v2/businesses/generateUrl:
    post:
      description: API for generating short lived session IDs, session ID should expire 5 days from created date
      operationId: generateUrl
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessUuid:
                  type: string
                  example: BUS-1233
              required:
              - businessUuid
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    readOnly: true
                    example: https://sites.railz.ai/ux34ass113333
                  expiryDate:
                    type: string
                    readOnly: true
                    example: '2021-08-09 23:50:00'
                required:
                - url
                - expiryDate
