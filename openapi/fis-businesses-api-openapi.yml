openapi: 3.2.0
info:
  title: FIS® Accounting Data as a Service™ Businesses API
  description: What's changed in our API
  version: v2
  contact: {}
servers:
- url: https://api.railz.ai
  description: Main (production) API server
tags:
- name: Businesses
paths:
  /businesses:
    get:
      description: Gets a list of all team's businesses.
      operationId: get businesses
      parameters:
      - name: businessName
        required: false
        in: query
        schema:
          example: Railz
          type: string
      - name: businessNameOrUuid
        required: false
        in: query
        description: Partial or full business name or UUID.
        schema:
          example: BIZ-123
          type: string
      - name: integrationUuids
        required: false
        in: query
        description: One or more integration uuids related to businesses to filter by.
        schema:
          minItems: 1
          example:
          - INT-123
          type: array
          items:
            type: string
      - name: status
        required: false
        in: query
        description: The status of a business. If no status is provided then it fetches all
        schema:
          minItems: 1
          type: array
          items:
            type: string
            enum:
            - active
            - inactive
            - new
      - name: limit
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 500
          format: integer
          type: number
      - name: offset
        required: false
        in: query
        schema:
          format: integer
          type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessesV1ResponseDto'
        '202':
          description: Data in pending state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessesV1ResponseDto'
        '204':
          description: No data available
        '400':
          description: Bad Request Error - Thrown if fields sent via query does not follow specifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400ResponseDto'
        '401':
          description: Unauthorized - Not logged in or log in expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401ResponseDto'
        '403':
          description: Forbidden - Not enough permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403ResponseDto'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500ResponseDto'
      security:
      - bearer: []
      summary: Get businesses
      tags:
      - Businesses
      x-summary-source: derived
    post:
      description: Create a business in 'new' state.
      operationId: create businesses
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostBusinessesResponseDto'
        '400':
          description: Bad Request Error - Thrown if fields sent via query does not follow specifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400ResponseDto'
        '401':
          description: Unauthorized - Not logged in or log in expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401ResponseDto'
        '403':
          description: Forbidden - Not enough permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403ResponseDto'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500ResponseDto'
      security:
      - bearer: []
      summary: Create businesses
      tags:
      - Businesses
      x-summary-source: derived
    put:
      description: Update a business name or metadata.
      operationId: update businesses
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutBusinessesResponseDto'
        '400':
          description: Bad Request Error - Thrown if fields sent via query does not follow specifications
          content:
            application/json:
              schema:
