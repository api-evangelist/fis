components:
  schemas:
    BusinessInfoDataV2:
      type: object
      properties:
        businessName:
          type: string
          example: Railz
        legalName:
          type: string
          example: Railz Financial Technologies Inc
        businessEmail:
          type: string
          example: noreply@railz.ai
        website:
          type: string
          example: www.railz.ai
        primaryPhoneNumber:
          type: string
          example: 416-555-1212
        fiscalYearEndDay:
          type: number
          example: 31
          format: integer
        fiscalYearEndMonth:
          type: number
          example: 12
          format: integer
        industryType:
          type: string
          example: Financial
        industryCode:
          type: string
          example: '123'
        businessShortCode:
          type: string
          example: 6Qfdg!
        baseCurrency:
          type: string
          example: USD
        businessRegistrationNumber:
          type: string
          example: BN123456789
        currencyRefs:
          type: array
          items:
            $ref: '#/components/schemas/BusinessInfoCurrencyRef'
        subsidiaryRefs:
          type: array
          items:
            $ref: '#/components/schemas/BusinessInfoSubsidiaryRef'
        mailingAddress:
          $ref: '#/components/schemas/BusinessInfoAddressV2'
        legalAddress:
          $ref: '#/components/schemas/BusinessInfoAddressV2'
        businessType:
          type: string
          example: organization
          enum:
          - soleProprietorship
          - partnership
          - limitedLiability
          - corporation
          - organization
          - other
          - unknown
          - notForProfit
        accountingMethod:
          type: string
          example: accrual
        passThrough:
          type: object
          additionalProperties: true
          example:
            CustomField:
            - DefinitionId: '1'
              StringValue: my custom value
              Name: Field One
      required:
      - businessType
      - accountingMethod
    Error400Dto:
      type: object
      properties:
        statusCode:
          type: number
          readOnly: true
          example: 400
        message:
          readOnly: true
          example:
          - businessName cannot be null
          type: array
          items:
            type: string
        error:
          type: string
          readOnly: true
          example: Bad Request
      required:
      - statusCode
      - message
      - error
    BusinessInfoSubsidiaryRefParentRef:
      type: object
      properties:
        id:
          type: string
          example: '2'
        name:
          type: string
          example: Honeywell Holdings
    BusinessInfoLocationParentRef:
      type: object
      properties:
        id:
          type: string
          example: '11'
        name:
          type: string
          example: United States
    Error401Dto:
      type: object
      properties:
        statusCode:
          type: number
          readOnly: true
          example: 401
        message:
          readOnly: true
          example:
          - Unauthorized
          type: array
          items:
            type: string
        error:
          type: string
          readOnly: true
          example: Unauthorized
      required:
      - statusCode
      - message
      - error
    Error403ResponseDto:
      type: object
      properties:
        error:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/Error403Dto'
        payload:
          type: object
          readOnly: true
          example: {}
      required:
      - error
      - payload
    BusinessInfoLocationRef:
      type: object
      properties:
        id:
          type: string
          example: '52'
        name:
          type: string
          example: United States
        address:
          $ref: '#/components/schemas/BusinessInfoLocationAddress'
        parentRef:
          $ref: '#/components/schemas/BusinessInfoLocationParentRef'
    Error401ResponseDto:
      type: object
      properties:
        error:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/Error401Dto'
        payload:
          type: object
          readOnly: true
          example: {}
      required:
      - error
      - payload
    BaseConnectionsResponseDataV1:
      type: object
      properties:
        connectionUuid:
          type: string
          readOnly: true
          example: CON-e66400c1-4d2f-4683-9bea-275799943695
        firstRecordDate:
          type: string
          example: '2020-12-25T01:02:03Z'
          format: date-time
        serviceName:
          type: string
          readOnly: true
          example: xero
          enum:
          - quickbooks
          - xero
          - freshbooks
          - quickbooksDesktop
          - sageIntacct
          - sageBusinessCloud
          - oracleNetsuite
          - dynamicsBusinessCentral
          - dynamics365Finance
          - wave
          - zohoBooks
          - myob
        description:
          type: string
          example: TD Bank
        status:
          type: string
          readOnly: true
          example: active
        createdAt:
          type: string
          readOnly: true
          example: '2020-12-25T01:02:03Z'
          format: date-time
        updatedAt:
          type: string
          readOnly: true
          example: '2020-12-25T01:02:03Z'
          format: date-time
        disconnectReason:
          type: string
          example: disconnectedByCustomer
        syncTime:
          type: number
          example: '1.3092'
        institution:
          example:
            name: Citizens bank
            logo: https://serverlogo.url
          allOf:
          - $ref: '#/components/schemas/ConnectionsInstitutionData'
        isMockData:
          type: boolean
          example: true
        serviceAccountRef:
          example:
            id: '12345'
            entityRef:
              id: '100'
          allOf:
          - $ref: '#/components/schemas/serviceAccountRefType'
        connectionId:
          type: string
          readOnly: true
          example: CON-e66400c1-4d2f-4683-9bea-275799943695
      required:
      - connectionUuid
      - serviceName
      - status
      - createdAt
      - updatedAt
      - connectionId
    BusinessesResponseDataV1:
      type: object
      properties:
        businessUuid:
          type: string
          readOnly: true
          example: BIZ-0f1ef788-54eb-4ed1-a7d3-5605febe6d84
        businessName:
          type: string
          readOnly: true
          example: Railz
        status:
          type: string
          readOnly: true
          example: active
        createdAt:
          type: string
          readOnly: true
          example: '2020-12-25T01:02:03Z'
          format: date-time
        updatedAt:
          type: string
          readOnly: true
          example: '2020-12-25T01:02:03Z'
          format: date-time
        metadata:
          readOnly: true
          example:
          - name: new business1
            value: canada
            webhookLocation:
