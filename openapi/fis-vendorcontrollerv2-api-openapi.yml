openapi: 3.2.0
info:
  title: FIS® Accounting Data as a Service™ Vendor Controller V2 API
  description: What's changed in our API
  version: v2
  contact: {}
servers:
- url: https://api.railz.ai
  description: Main (production) API server
tags:
- name: VendorControllerV2
paths:
