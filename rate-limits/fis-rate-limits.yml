specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: FIS
providerId: fis
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Banking
  - Core Banking
  - Financial Services
  - Payments
  - Wealth Management
  - Rate Limiting
description: FIS does not publish numeric rate limits for its public-facing API products. Throttles are sized per FI customer's licensed capacity tier and are governed by the master service agreement. Public 429/503 conventions apply to web-facing endpoints; legacy mainframe and IBS connectors typically operate on session/queue throughput limits rather than HTTP rate limits.
notes: No public RPS/RPM numbers published. Scaffold trimmed to a single umbrella entry. Per-FI limits are set during onboarding/capacity planning.
sources:
  - https://www.fisglobal.com/
  - https://developer.fis.com/
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Per-customer FI throttle
    scope: customer/api-key
    metric: varies
    limit: per-FI capacity tier; not publicly published
    applies:
      - FIS Core Banking API
      - FIS Payments API
      - FIS Wealth Management API
policies:
  - name: Backoff Strategy
    description: Clients should implement exponential backoff with jitter on 429/5xx responses; Retry-After is honored when emitted.
  - name: Capacity Tiering
    description: Throughput is provisioned per customer financial institution at onboarding; raises require account-team engagement and capacity planning.
  - name: Settlement / Batch Windows
    description: Batch and settlement windows on core banking and payments products may impose stricter throttles or queueing during cutoff periods.
  - name: Sandbox vs Production
    description: Sandbox throughput is intentionally low and unsuitable for performance/load testing; production load tests must be coordinated with the FIS account team.
maintainers: []
