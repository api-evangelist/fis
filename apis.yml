  severity: high
  applies_to:
  - openapi/_original/fis-payments-openapi.yml
  - openapi/fis-accounts-api-openapi.yml
  - openapi/fis-ach-api-openapi.yml
  - openapi/fis-payments-api-openapi.yml
  - openapi/fis-transactions-api-openapi.yml
  - openapi/fis-wire-transfers-api-openapi.yml
  finding: 'The FIS Payments OpenAPI in openapi/_original/, and the five per-tag specs split from it, declare servers[] of https://api.fisglobal.com/v1 and https://sandbox.api.fisglobal.com/v1. Neither host resolves in DNS — both return NXDOMAIN as of 2026-09-10 — and the same api.fisglobal.com value is carried as the baseURL on six apis[] entries. No FIS document reachable without a Code Connect account names either host, and FIS''s own developer index at https://www.fisglobal.com/developer names four product portals, none of them api.fisglobal.com. This pass therefore treated that spec as unverified: no new artifact in this repository is derived from it, and the authentication and scopes artifacts that previously were have been rewritten from the provider''s own published documentation instead.'
  action: Needs a scaffold-sweep decision on whether the spec was harvested or authored. Not deleted here; deleting six wired specs is outside the scope of an enrichment pass.
  evidence:
  - probe: dig api.fisglobal.com
    result: NXDOMAIN
  - probe: dig sandbox.api.fisglobal.com
    result: NXDOMAIN
