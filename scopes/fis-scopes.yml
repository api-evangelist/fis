note: >-
  FIS publishes no OAuth scope surface that a member of the public can read. The one public
  contract, FIS Accounting Data as a Service, authenticates with an opaque bearer token minted
  from a Basic-auth key pair — it declares no oauth2 securityScheme and no scopes, so there is
  nothing to enumerate. FIS Code Connect generates client keys behind a reviewed registration;
  whatever scope model it uses is not visible without an account.
supersedes:
  note: >-
    Replaces the 2026-07-11 derived file, which listed accounts:read / payments:read /
    payments:write against a tokenUrl of https://api.fisglobal.com/oauth/token. That host
    returns NXDOMAIN and no FIS document reachable without a Code Connect account corroborates
    those scope names, so they are withdrawn rather than carried forward. The OAuthScopes
    pointer is withdrawn from apis.yml with them — an empty scope surface should not be
    credited as a documented one.
