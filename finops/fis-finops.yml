providerId: fis
publisherName: Fidelity National Information Services, Inc.
serviceCategory: Financial Services Software
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Banking
  - Core Banking
  - Financial Services
  - Payments
