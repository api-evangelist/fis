description: FOCUS-aligned FinOps mapping for FIS — enterprise B2B fintech billed via per-product licensing plus volume meters (per-account, per-transaction, per-asset under management) under master service agreements.
notes: FIS does not publish public price lists. Meters below model the expected line items on FI customer invoices but exact billing structure varies per product (Modern Banking Platform, IBS, HORIZON, etc.) and per contract.
sources:
  - https://www.fisglobal.com/
billingModel:
  pricingCategory: Tiered Subscription + Usage
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Adjustment
    - Credit
focusColumns:
  ServiceName: FIS
  ServiceCategory: Financial Services Software
  ProviderName: Fidelity National Information Services, Inc.
  PublisherName: Fidelity National Information Services, Inc.
  InvoiceIssuerName: Fidelity National Information Services, Inc.
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: licensed_accounts
    description: Active customer accounts on FIS-hosted banking platforms (used as the primary core-banking volume meter)
    unit: account-month
    aggregation: max
    dimensions:
      - product
      - region
      - institution
  - name: transactions_processed
    description: Payment, ACH, wire, card, and core-banking transactions processed
    unit: transaction
    aggregation: sum
    dimensions:
      - product
      - rail
      - institution
  - name: assets_under_administration
    description: Wealth management assets administered (used as the volume meter for wealth/trust products)
    unit: USD
    aggregation: avg
    dimensions:
      - product
      - institution
  - name: licensing_fees
    description: Recurring product, module, and platform license fees
    unit: month
    aggregation: sum
    dimensions:
      - product
      - institution
  - name: implementation_services
    description: One-time implementation, integration, and professional-services charges
    unit: project
    aggregation: sum
    dimensions:
      - product
      - institution
principles:
  - name: Visibility
    description: Reconcile FIS monthly invoices against internal account/transaction counts pulled from your data warehouse; require contract pricing schedules to be tagged by product line for chargeback.
  - name: Allocation
    description: Use product, rail, and institution dimensions to allocate FIS spend to business lines (retail, commercial, wealth, payments).
  - name: Optimization
    description: Lever cost via account dormancy cleanup, channel routing (least-cost rails), batch consolidation, and renegotiating tiered minimums on contract renewal.
  - name: Accountability
    description: Vendor-management ownership of the FIS master service agreement should sit with COO/CIO office; finance reviews quarterly true-ups against minimum commitments.
maintainers: []
