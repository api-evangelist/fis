versioning:
  scheme: uri-path
  current: v2
  docs: https://docs.railz.ai/changelog
  detail: >-
    Versioning is per-path, not per-host. The contract carries both an unprefixed v1 surface
    (/accounts, /connections, /refunds) and a /v2/ surface that supersedes it (/v2/accounting/accounts,
    /v2/connections). info.version is "v2". Both generations are live in the same document —
    of the 175 paths, roughly half are the older unprefixed form.
  policy_published: false
deprecation:
  policy_url: null
  sunset_header: false
  detail: >-
    No deprecation policy and no RFC 8594 Sunset/Deprecation header support is published, and
    not one of the 233 operations is flagged `deprecated: true` in the contract — including the
    unprefixed v1 operations that the /v2/ paths plainly replace. A consumer on the v1 surface
    has no machine-readable signal that it is superseded and no stated retirement date.
